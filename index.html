<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Commander Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- TRADUTTORE STABILE RIPRISTINATO -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    body { -webkit-font-smoothing: antialiased; background-color: #111827; color: #f3f4f6; overflow-x: hidden; user-select: none; -webkit-touch-callout: none; }
    .animate-fade { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    button { touch-action: manipulation; }

    /* Stile per Stampa PDF Proxy */
    @media print {
      body { background: white; color: black; }
      .no-print { display: none !important; }
      .print-grid { display: grid; grid-template-columns: repeat(3, 63mm); gap: 2mm; justify-content: center; }
      .print-card { width: 63mm; height: 88mm; object-fit: cover; border-radius: 3mm; margin-bottom: 2mm; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icons = {
      Menu: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16"/></svg>,
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
      Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    };

    const ManaColors = [
      { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' },
      { id: 'U', color: 'bg-blue-500 text-white', label: 'U' },
      { id: 'B', color: 'bg-gray-800 text-white', label: 'B' },
      { id: 'R', color: 'bg-red-500 text-white', label: 'R' },
      { id: 'G', color: 'bg-green-500 text-white', label: 'G' },
      { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' }
    ];

    function App() {
      const [view, setView] = useState('home');
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeDeck, setActiveDeck] = useState(null); 
      
      const navigate = (newView, deck = null) => { setActiveDeck(deck); setView(newView); setMenuOpen(false); };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-gray-900 border-b border-gray-700 p-4 flex justify-between items-center fixed top-0 w-full z-50 shadow-md no-print">
            <button onClick={() => setMenuOpen(true)} className="text-gray-300 hover:text-white"><Icons.Menu /></button>
            <h1 className="text-lg font-bold tracking-widest text-white">MTG <span className="text-red-500">FOR FUN</span></h1>
            <button onClick={() => navigate('home')} className="text-gray-300 hover:text-white"><Icons.Home /></button>
          </header>

          {menuOpen && (
            <div className="fixed inset-0 bg-black/80 z-50 no-print" onClick={() => setMenuOpen(false)}>
              <div className="w-64 bg-gray-900 h-full p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                <h2 className="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">Menu</h2>
                <nav className="space-y-4">
                  <MenuBtn icon={<Icons.Home/>} text="Home" onClick={() => navigate('home')} />
                  <MenuBtn icon="🎴" text="Deckbuilding" onClick={() => navigate('deckbuilder')} />
                  <MenuBtn icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} />
                  <MenuBtn icon="✨" text="Proxy Creator" onClick={() => navigate('proxycreator')} />
                  <MenuBtn icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} />
                  <MenuBtn icon="🎲" text="Lancia Dado" onClick={() => navigate('dice')} />
                  <MenuBtn icon="⚖️" text="Arbitro AI (Regole)" onClick={() => navigate('rules')} />
                </nav>
              </div>
            </div>
          )}

          <main className="pt-20 px-2 pb-10 flex-1 animate-fade">
            {view === 'home' && <HomeView navigate={navigate} />}
            {view === 'deckbuilder' && <DeckBuilder navigate={navigate} activeDeck={activeDeck} />}
            {view === 'mydecks' && <MyDecks navigate={navigate} />}
            {view === 'proxycreator' && <ProxyCreator />}
            {view === 'printview' && <PrintView deck={activeDeck} navigate={navigate} />}
            {view === 'game' && <GameUtility />}
            {view === 'dice' && <DiceRoller />}
            {view === 'rules' && <RulesAI />}
          </main>
        </div>
      );
    }

    const MenuBtn = ({icon, text, onClick}) => (
      <button onClick={onClick} className="w-full flex items-center space-x-3 text-gray-300 hover:text-white p-2 rounded hover:bg-gray-800">
        <span>{icon}</span> <span className="font-semibold">{text}</span>
      </button>
    );

    // --- HOME ---
    const HomeView = ({navigate}) => (
      <div className="flex flex-col items-center">
        <div className="w-full h-80 bg-gray-800 rounded-xl overflow-hidden mb-6 relative border border-gray-700 shadow-xl" style={{ height: '400px' }}>
          <img src="mtg-bg.jpg" alt="MTG Background" className="w-full h-full object-cover" onError={(e) => e.target.style.display='none'} />
          <div className="absolute inset-0 bg-black/40 flex items-center justify-center flex-col pointer-events-none">
            <h2 className="text-5xl font-black text-white drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-widest text-center">FOR FUN<br/><span className="text-red-500">EDITION</span></h2>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-4 w-full max-w-md">
          <ActionCard icon="🎴" text="Crea Mazzo" onClick={() => navigate('deckbuilder')} color="bg-blue-900" />
          <ActionCard icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} color="bg-emerald-900" />
          <ActionCard icon="✨" text="Proxy Lair" onClick={() => navigate('proxycreator')} color="bg-purple-900" />
          <ActionCard icon="⚔️" text="Gioca" onClick={() => navigate('game')} color="bg-red-900" />
        </div>
      </div>
    );

    const ActionCard = ({icon, text, onClick, color}) => (
      <button onClick={onClick} className={`${color} p-6 rounded-xl flex flex-col items-center justify-center border border-gray-600 shadow-lg active:scale-95 transition-transform`}>
        <div className="text-3xl mb-2">{icon}</div>
        <span className="font-bold text-sm">{text}</span>
      </button>
    );

    // --- DECKBUILDER POTENZIATO ---
    const DeckBuilder = ({navigate, activeDeck}) => {
      const [deckName, setDeckName] = useState(activeDeck ? activeDeck.name : "");
      const [deck, setDeck] = useState(activeDeck ? activeDeck.cards : []);
      const [rulebreaker, setRulebreaker] = useState(activeDeck ? (activeDeck.rulebreaker || false) : false);
      
      const [query, setQuery] = useState("");
      const [mana, setMana] = useState([]);
      const [cardType, setCardType] = useState("");
      const [subType, setSubType] = useState("");
      const [cmcOp, setCmcOp] = useState("=");
      const [cmcVal, setCmcVal] = useState("");
      
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [nextPage, setNextPage] = useState(null);
      const [selectedCard, setSelectedCard] = useState(null);

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = async (url) => {
        setLoading(true);
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data.data) {
             const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces[0].image_uris)).map(c => {
               let img = null;
               if (c.image_uris) img = c.image_uris.normal;
               else if (c.card_faces && c.card_faces[0].image_uris) img = c.card_faces[0].image_uris.normal;
               return {
                 id: c.id, name: c.name, image: img, type: c.type_line, cmc: c.cmc, colors: c.color_identity, isCommander: false
               };
             });
             if (url.includes('page=')) setResults([...results, ...cards]);
             else setResults(cards);
             setNextPage(data.has_more ? data.next_page : null);
          } else { 
             if(!url.includes('page=')) { setResults([]); alert("Nessuna carta trovata!"); }
          }
        } catch(e) { console.error(e); }
        setLoading(false);
      };

      const searchCard = () => {
        let searchQuery = query ? `${query} ` : "";
        if (mana.length > 0) searchQuery += `c:${mana.join('')} `;
        if (cardType) searchQuery += `t:${cardType} `;
        if (subType) searchQuery += `t:${subType} `;
        if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        
        if(!searchQuery.trim()) return alert("Inserisci almeno un parametro di ricerca!");
        eseguiRicerca(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery.trim())}`);
      };

      const addToDeck = (card) => {
        setDeck([...deck, {...card, deckId: Date.now()}]);
        setSelectedCard(null);
      };

      const saveDeck = () => {
        if(!deckName) return alert("Dai un nome al mazzo!");
        let savedDecks = JSON.parse(localStorage.getItem('mtg_decks') || '[]');
        const newDeckObj = { id: activeDeck ? activeDeck.id : Date.now(), name: deckName, cards: deck, rulebreaker: rulebreaker, date: new Date().toLocaleDateString() };
        if(activeDeck) savedDecks = savedDecks.map(d => d.id === activeDeck.id ? newDeckObj : d);
        else savedDecks.push(newDeckObj);
        localStorage.setItem('mtg_decks', JSON.stringify(savedDecks));
        alert("Mazzo Salvato!");
        navigate('mydecks');
      };

      const totalCMC = deck.reduce((acc, c) => acc + (c.cmc || 0), 0);
      const avgCMC = deck.length > 0 ? (totalCMC / deck.length).toFixed(2) : 0;

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          
          {selectedCard && (
            <div className="fixed inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center p-4 animate-fade" onClick={() => setSelectedCard(null)}>
              <div onClick={e => e.stopPropagation()} className="max-w-md w-full flex flex-col items-center">
                 <img src={selectedCard.image} alt={selectedCard.name} className="w-full max-h-[75vh] object-contain rounded-xl mb-6 shadow-2xl" />
                 <div className="flex gap-4 w-full">
                   <button onClick={() => setSelectedCard(null)} className="flex-1 bg-gray-600 text-white font-bold py-3 rounded-xl">Chiudi</button>
                   <button onClick={() => addToDeck(selectedCard)} className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">+ Aggiungi</button>
                 </div>
              </div>
            </div>
          )}

          <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
            <input type="text" placeholder="Nome del Mazzo" value={deckName} onChange={e => setDeckName(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-xl font-bold mb-4" />
            <div className="flex justify-between items-center text-sm mb-2">
              <span className={`px-2 py-1 rounded font-bold ${deck.length === 100 ? 'bg-green-600' : 'bg-red-600'}`}>{deck.length} / 100 Carte</span>
              <span className="bg-blue-600 px-2 py-1 rounded font-bold">Avg CMC: {avgCMC}</span>
            </div>
          </div>

          <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
             <h3 className="font-bold text-blue-400 mb-3 border-b border-gray-700 pb-1">Ricerca Avanzata</h3>
             <div className="flex gap-2 mb-3">
               <input type="text" placeholder="Nome o parola chiave..." value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard()} className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-white" />
             </div>
             
             <div className="flex gap-2 mb-3 overflow-x-auto pb-1 justify-center">
               {ManaColors.map(m => (
                 <button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>
               ))}
             </div>

             <div className="grid grid-cols-2 gap-2 mb-3">
               <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm">
                 <option value="">Tipo...</option>
                 <option value="creature">Creatura</option>
                 <option value="artifact">Artefatto</option>
                 <option value="enchantment">Incantesimo</option>
                 <option value="instant">Istantaneo</option>
                 <option value="sorcery">Stregoneria</option>
                 <option value="land">Terra</option>
               </select>
               <input type="text" placeholder="Sottotipo (es. Goblin)" value={subType} onChange={e => setSubType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" />
             </div>

             <div className="flex gap-2 mb-4">
               <span className="text-gray-400 text-sm py-2">Costo:</span>
               <select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm">
                 <option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option>
               </select>
               <input type="number" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" />
             </div>

             <button onClick={searchCard} className="w-full bg-blue-600 font-bold py-3 rounded text-white shadow-lg flex justify-center items-center gap-2">
               {loading && !nextPage ? 'Cerco...' : <><Icons.Search /> Cerca Carte</>}
             </button>
          </div>

          {results.length > 0 && (
            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
              <h3 className="text-gray-400 text-sm mb-3">Trovate {results.length} carte (Clicca per ingrandire):</h3>
              <div className="grid grid-cols-3 gap-2">
                {results.map((card, i) => (
                  <div key={i} className="relative cursor-pointer hover:ring-2 ring-blue-500 rounded" onClick={() => setSelectedCard(card)}>
                    <img src={card.image} alt={card.name} className="w-full rounded" />
                  </div>
                ))}
              </div>
              {nextPage && (
                <button onClick={() => eseguiRicerca(nextPage)} className="mt-4 w-full bg-gray-700 hover:bg-gray-600 py-3 rounded font-bold text-blue-400 border border-blue-500">
                  {loading ? 'Caricamento...' : 'Carica Altre Carte ⬇️'}
                </button>
              )}
            </div>
          )}

          {deck.length > 0 && (
            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
              <h3 className="font-bold text-white mb-3">La tua Lista:</h3>
              <div className="space-y-3">
                {deck.map((card, index) => (
                  <div key={card.deckId} className={`flex gap-3 bg-gray-900 p-2 rounded border ${card.isCommander ? 'border-yellow-500' : 'border-gray-700'}`}>
                    <img src={card.proxyImage || card.image} alt={card.name} className="w-16 rounded shadow object-cover cursor-pointer" onClick={() => setSelectedCard({image: card.proxyImage || card.image})} />
                    <div className="flex-1 text-sm">
                      <h4 className="font-bold text-gray-200">{card.name}</h4>
                      <p className="text-xs text-gray-500 truncate">{card.type}</p>
                      <div className="flex gap-3 mt-2 items-center">
                        <label className="flex items-center gap-1 text-yellow-500 text-xs font-bold cursor-pointer">
                          <input type="checkbox" checked={card.isCommander} onChange={() => {
                            const newDeck = [...deck];
                            newDeck[index].isCommander = !newDeck[index].isCommander;
                            setDeck(newDeck);
                          }} className="accent-yellow-500" /> Cmdr
                        </label>
                        <button onClick={() => setDeck(deck.filter(c => c.deckId !== card.deckId))} className="text-xs text-red-500 underline ml-auto">Rimuovi</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button onClick={saveDeck} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg sticky bottom-4">Salva Definitivo</button>
        </div>
      );
    };

    // --- I MIEI MAZZI ---
    const MyDecks = ({navigate}) => {
      const [decks, setDecks] = useState([]);
      useEffect(() => { setDecks(JSON.parse(localStorage.getItem('mtg_decks') || '[]')); }, []);

      const deleteDeck = (id) => {
        if(confirm("Eliminare definitivamente?")) {
          const newD = decks.filter(d => d.id !== id);
          localStorage.setItem('mtg_decks', JSON.stringify(newD));
          setDecks(newD);
        }
      };

      if (decks.length === 0) return <div className="text-center text-gray-500 mt-10">Nessun mazzo salvato.</div>;

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
          {decks.map(d => {
            const cmds = d.cards.filter(c => c.isCommander);
            let mainImg = '';
            if (cmds.length > 0 && cmds[0]) mainImg = cmds[0].image;
            else if (d.cards[0]) mainImg = d.cards[0].image;

            return (
              <div key={d.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg flex flex-col">
                 <div className="h-32 bg-gray-900 relative">
                   <img src={mainImg} className="w-full h-full object-cover object-top opacity-50" />
                   <div className="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                   <h3 className="absolute bottom-2 left-4 text-xl font-black text-white drop-shadow-md">{d.name}</h3>
                 </div>
                 <div className="p-3 bg-gray-900 grid grid-cols-2 gap-2 text-sm font-bold">
                   <button onClick={() => navigate('deckbuilder', d)} className="bg-blue-600 text-white rounded py-2">Modifica</button>
                   <button onClick={() => navigate('printview', d)} className="bg-purple-600 text-white rounded py-2">Stampa PDF</button>
                   <button onClick={() => deleteDeck(d.id)} className="col-span-2 bg-red-800 text-white rounded py-2 mt-2">Elimina</button>
                 </div>
              </div>
            );
          })}
        </div>
      );
    };

    // --- STAMPA PROXY (PDF) ---
    const PrintView = ({deck, navigate}) => {
      if(!deck) return null;
      return (
        <div className="print-container w-full h-full bg-white text-black p-4 absolute top-0 left-0 z-50">
          <div className="no-print mb-4 p-4 bg-gray-100 rounded border border-gray-300 flex justify-between items-center">
            <p className="font-bold text-gray-800">Usa "Stampa -> Salva come PDF".<br/>(Carte formattate a 63x88mm).</p>
            <div className="space-x-2">
              <button onClick={() => navigate('mydecks')} className="px-4 py-2 bg-gray-500 text-white rounded">Indietro</button>
              <button onClick={() => window.print()} className="px-4 py-2 bg-blue-600 text-white font-bold rounded">Stampa</button>
            </div>
          </div>
          <div className="print-grid">
            {deck.cards.map((c, i) => <img key={i} src={c.proxyImage || c.image} className="print-card shadow-sm border border-gray-300" />)}
          </div>
        </div>
      );
    };

    // --- PROXY CREATOR CON CSS OVERLAY SICURO ---
    const ProxyCreator = () => {
      const [baseQuery, setBaseQuery] = useState("");
      const [baseCard, setBaseCard] = useState(null);
      const [customName, setCustomName] = useState("");
      const [customImg, setCustomImg] = useState("");
      
      const searchBase = async () => {
        try {
          const res = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(baseQuery)}`);
          const c = await res.json();
          if(c.id) {
             let imgUrl = null;
             if (c.image_uris) imgUrl = c.image_uris.normal;
             else if (c.card_faces && c.card_faces[0].image_uris) imgUrl = c.card_faces[0].image_uris.normal;
             
             setBaseCard({ name: c.name, type: c.type_line, img: imgUrl });
             setCustomName(""); setCustomImg("");
          } else alert("Carta non trovata");
        } catch(e) {}
      };

      const handleImage = (e) => {
        const file = e.target.files[0];
        if(file) {
          const r = new FileReader();
          r.onload = (ev) => setCustomImg(ev.target.result);
          r.readAsDataURL(file);
        }
      };

      return (
        <div className="max-w-md mx-auto space-y-4">
          <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
            <h2 className="text-xl font-bold text-purple-400 mb-2">Proxy Creator</h2>
            <p className="text-xs text-gray-400 mb-4">Crea una carta alterata. L'app posizionerà la tua foto e il tuo titolo esattamente sopra l'immagine e il nome della vera carta di Magic, mantenendo intatte regole e costo di mana!</p>
            
            <div className="flex gap-2 mb-4">
              <input type="text" placeholder="Cerca Carta Reale..." value={baseQuery} onChange={e => setBaseQuery(e.target.value)} className="flex-1 bg-gray-900 border border-gray-600 p-2 rounded text-white" />
              <button onClick={searchBase} className="bg-purple-600 px-3 rounded text-white font-bold">Cerca</button>
            </div>
            
            {baseCard && (
              <div className="space-y-4 animate-fade">
                <input type="text" placeholder="Nuovo Titolo (Nickname)" value={customName} onChange={e => setCustomName(e.target.value)} className="w-full bg-gray-900 border border-gray-600 p-2 rounded text-white font-bold" />
                <label className="block w-full bg-gray-700 hover:bg-gray-600 text-center py-3 rounded cursor-pointer font-bold text-sm text-white">
                  📸 Carica la tua Illustrazione
                  <input type="file" accept="image/*" className="hidden" onChange={handleImage} />
                </label>
                
                {/* LA MAGIA DELL'OVERLAY CSS CON STILI INLINE SICURI */}
                <div className="relative w-full rounded-xl overflow-hidden shadow-2xl bg-black border border-gray-600 mt-6" style={{ aspectRatio: '63/88' }}>
                  <img src={baseCard.img} className="absolute inset-0 w-full h-full" />
                  
                  {customImg && (
                    <div className="absolute bg-black z-10 overflow-hidden shadow-inner" style={{ top: '11.5%', left: '8%', width: '84%', height: '44%' }}>
                      <img src={customImg} className="w-full h-full object-cover" />
                    </div>
                  )}

                  {customName && (
                    <div className="absolute bg-[#1a1a1a] z-20 flex items-center px-2 rounded-sm border border-gray-500 shadow-md" style={{ top: '4.5%', left: '7%', width: '65%', height: '5%' }}>
                      <span className="text-white font-bold text-xs tracking-wide truncate">{customName}</span>
                    </div>
                  )}
                </div>

                <div className="text-xs text-gray-500 text-center bg-gray-900 p-2 rounded">
                  💡 Fai uno <b>Screenshot</b> di questa carta tagliando i bordi del telefono!
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- GAME UTILITY (LIFE TRACKER - RIPARATO) ---
    const GameUtility = () => {
      const [setup, setSetup] = useState(true);
      const [numPlayers, setNumPlayers] = useState(4);
      const [startLife, setStartLife] = useState(40);
      const [players, setPlayers] = useState([]);

      const startGame = () => {
        let newPlayers = [];
        for(let i=1; i<=numPlayers; i++) {
          let cmdDmg = {};
          for(let j=1; j<=numPlayers; j++) { if(i!==j) cmdDmg[`P${j}`] = 0; }
          newPlayers.push({ id: `P${i}`, name: `Player ${i}`, life: startLife, poison: 0, cmdCasts: 0, emblems: 0, immune: false, cmdDmg: cmdDmg });
        }
        setPlayers(newPlayers);
        setSetup(false);
      };

      const updateStat = (playerId, stat, amount, opponentId = null) => {
        setPlayers(prev => prev.map(p => {
          if (p.id !== playerId) return p;
          if (opponentId) return { ...p, cmdDmg: { ...p.cmdDmg, [opponentId]: Math.max(0, p.cmdDmg[opponentId] + amount) } };
          return { ...p, [stat]: Math.max(0, p[stat] + amount) };
        }));
      };

      const toggleImmunity = (playerId) => { setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, immune: !p.immune } : p)); };

      if (setup) return (
        <div className="max-w-md mx-auto bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mt-4">
          <h2 className="text-2xl font-bold mb-6 text-center text-red-500">Setup Partita</h2>
          <div className="mb-4">
            <label className="block text-gray-400 mb-2">Numero Giocatori (1-6)</label>
            <input type="number" min="1" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center text-xl" />
          </div>
          <div className="mb-6">
            <label className="block text-gray-400 mb-2">Punti Vita Iniziali</label>
            <select value={startLife} onChange={e => setStartLife(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center text-xl">
              <option value={40}>40 (Commander)</option>
              <option value={20}>20 (Standard)</option>
            </select>
          </div>
          <button onClick={startGame} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg">Inizia Partita</button>
        </div>
      );

      const gridClass = players.length === 1 ? 'grid-cols-1' : (players.length <= 4 ? 'grid-cols-2' : 'grid-cols-2 lg:grid-cols-3');

      return (
        <div className={`grid ${gridClass} gap-2 h-[80vh]`}>
          {players.map(p => <PlayerCard key={p.id} player={p} updateStat={updateStat} toggleImmunity={toggleImmunity} opponents={players.filter(op => op.id !== p.id)} />)}
        </div>
      );
    };

    const PlayerCard = ({ player, updateStat, toggleImmunity, opponents }) => {
      const [viewStats, setViewStats] = useState(false); 
      
      const isDead = (player.life <= 0 || player.poison >= 10 || Object.values(player.cmdDmg).some(dmg => dmg >= 21)) && !player.immune;

      const handleHold = (stat, amount, oppId = null) => {
        let timer;
        const start = (e) => {
          if (e.type === 'touchstart') e.preventDefault(); 
          updateStat(player.id, stat, amount, oppId);
          timer = setTimeout(() => {
            updateStat(player.id, stat, amount * 9, oppId);
          }, 2000); 
        };
        const clear = () => clearTimeout(timer);
        return {
          onTouchStart: start,
          onTouchEnd: clear,
          onTouchCancel: clear,
          onMouseDown: (e) => { if(e.button === 0) start(e); },
          onMouseUp: clear,
          onMouseLeave: clear
        };
      };

      if (viewStats) {
        return (
          <div className="w-full h-full min-h-[250px] flex flex-col rounded-xl border-2 border-blue-600 bg-gray-800 overflow-hidden shadow-lg p-2 animate-fade">
            <div className="flex justify-between items-center border-b border-gray-700 pb-1 mb-2">
              <span className="font-bold text-sm text-blue-400">Statistiche {player.name}</span>
              <button onClick={() => setViewStats(false)} className="p-1 bg-blue-700 rounded-full text-white shadow"><Icons.Back/></button>
            </div>
            
            <div className="overflow-y-auto space-y-3 pb-2 text-sm flex-1">
              <div className="bg-gray-900 p-2 rounded">
                <p className="text-xs text-red-400 font-bold mb-2 uppercase">⚔️ Danni Comandante Da:</p>
                {opponents.map(opp => (
                   <StatRow key={opp.id} label={opp.name} value={player.cmdDmg[opp.id]} handlers={{sub: handleHold('cmdDmg', -1, opp.id), add: handleHold('cmdDmg', 1, opp.id)}} />
                ))}
              </div>

              <div className="space-y-2">
                <StatRow label="💧 Veleno" value={player.poison} handlers={{sub: handleHold('poison', -1), add: handleHold('poison', 1)}} />
                <StatRow label="⚔️ Lanci Cmd" value={player.cmdCasts} handlers={{sub: handleHold('cmdCasts', -1), add: handleHold('cmdCasts', 1)}} />
                <StatRow label="🛡️ Emblemi" value={player.emblems} handlers={{sub: handleHold('emblems', -1), add: handleHold('emblems', 1)}} />
              </div>
            </div>
            
            <button onClick={() => toggleImmunity(player.id)} className={`w-full py-2 mt-2 text-sm font-bold rounded ${player.immune ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-400 border border-gray-600'}`}>
              {player.immune ? '🛡️ Immunità Attiva' : 'Attiva Immunità'}
            </button>
          </div>
        );
      }

      return (
        <div className={`w-full h-full min-h-[250px] flex flex-col rounded-xl border-2 relative animate-fade ${isDead ? 'border-red-600 bg-red-950' : 'border-gray-700 bg-gray-800'} overflow-hidden shadow-lg`}>
          {isDead && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-30 pointer-events-none">💀</div>}
          {player.immune && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-20 pointer-events-none text-blue-500">🛡️</div>}
          
          <div className="flex justify-between items-center bg-gray-900/80 p-2 z-10 border-b border-gray-700">
            <span className="font-bold text-gray-200">{player.name}</span>
            <button onClick={() => setViewStats(true)} className="px-2 py-1 bg-gray-700 border border-gray-600 rounded text-xs text-white shadow font-bold">Statistiche ⚙️</button>
          </div>
          
          <div className="flex-1 flex items-center justify-between px-1 z-10">
            <button {...handleHold('life', -1)} className="w-16 h-full flex items-center justify-center text-5xl font-bold text-red-400 active:bg-red-500/20 rounded-l">-</button>
            <div className="text-6xl font-black text-white">{player.life}</div>
            <button {...handleHold('life', 1)} className="w-16 h-full flex items-center justify-center text-5xl font-bold text-green-400 active:bg-green-500/20 rounded-r">+</button>
          </div>
        </div>
      );
    };

    const StatRow = ({ label, value, handlers }) => (
      <div className="flex justify-between items-center bg-gray-800 rounded px-2 py-1 mt-1">
        <span className="text-gray-300 font-bold">{label}</span>
        <div className="flex items-center space-x-3">
          <button {...handlers.sub} className="w-8 h-8 bg-red-900/50 rounded font-bold text-red-400 active:bg-red-800">-</button>
          <span className="w-4 text-center font-bold text-white">{value}</span>
          <button {...handlers.add} className="w-8 h-8 bg-green-900/50 rounded font-bold text-green-400 active:bg-green-800">+</button>
        </div>
      </div>
    );

    // --- DICE ROLLER E ARBITRO INVARIATI ---
    const DiceRoller = () => {
      const [numPlayers, setNumPlayers] = useState(4);
      const [results, setResults] = useState([]);
      const [winnerMessage, setWinnerMessage] = useState("");

      const rollDice = () => {
        let rolls = []; let max = 0;
        for(let i=1; i<=numPlayers; i++) {
          const roll = Math.floor(Math.random() * 20) + 1;
          rolls.push({ player: `Player ${i}`, roll: roll });
          if(roll > max) max = roll;
        }
        setResults(rolls);
        const winners = rolls.filter(r => r.roll === max);
        if(winners.length === 1) setWinnerMessage(`🎉 Inizia: ${winners[0].player}!`);
        else setWinnerMessage(`Pareggio tra: ${winners.map(w=>w.player).join(', ')}. Ritirate!`);
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800 p-6 rounded-xl border border-gray-700 mt-10">
          <h2 className="text-2xl font-bold mb-6 text-center text-purple-400">Tira il Dado (D20)</h2>
          <label className="block text-gray-400 mb-2">Numero Giocatori</label>
          <input type="number" min="2" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center mb-6" />
          <button onClick={rollDice} className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl text-lg mb-6 shadow-lg">Tira il Dado!</button>
          {results.length > 0 && (
            <div className="space-y-2">
              {results.map((r, i) => (
                <div key={i} className="flex justify-between p-3 bg-gray-900 rounded border border-gray-700">
                  <span className="font-bold text-gray-300">{r.player}</span>
                  <span className="font-black text-white text-xl">{r.roll}</span>
                </div>
              ))}
              <div className="mt-4 p-3 bg-green-900/40 border border-green-500 rounded text-center font-bold text-green-400">{winnerMessage}</div>
            </div>
          )}
        </div>
      );
    };

    const RulesAI = () => {
      const [question, setQuestion] = useState("");
      const askJudge = () => {
        if(!question) return;
        const prompt = `Sei un Arbitro Livello 3 di Magic: The Gathering. Rispondi in italiano a questo dubbio: "${question}"`;
        window.open(`https://gemini.google.com/app?q=${encodeURIComponent(prompt)}`, '_blank');
      };
      return (
        <div className="max-w-md mx-auto bg-gray-800 p-6 rounded-xl border border-gray-700 mt-10 text-center">
          <h2 className="text-2xl font-bold mb-4 text-green-400">Arbitro AI</h2>
          <textarea className="w-full h-32 bg-gray-900 border border-gray-600 rounded p-3 text-white mb-4" placeholder="Es: Se attacco con..." value={question} onChange={(e) => setQuestion(e.target.value)}></textarea>
          <button onClick={askJudge} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl flex justify-center w-full shadow-lg">Chiedi all'Arbitro</button>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
