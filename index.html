<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Commander Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    /* Sfondo impostato globalmente qui sotto via React, togliamo i colori fissi */
    body { -webkit-font-smoothing: antialiased; overflow-x: hidden; user-select: none; -webkit-touch-callout: none; background-color: #000; }
    .animate-fade { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    button { touch-action: manipulation; }

    @media print {
      body { background: white !important; color: black; }
      .no-print { display: none !important; }
      .print-grid { display: grid; grid-template-columns: repeat(3, 63mm); gap: 2mm; justify-content: center; }
      .print-card { width: 63mm; height: 88mm; object-fit: cover; border-radius: 3mm; margin-bottom: 2mm; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icons = {
      Menu: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16"/></svg>,
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
      Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    };

    const ManaColors = [
      { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' },
      { id: 'U', color: 'bg-blue-500 text-white', label: 'U' },
      { id: 'B', color: 'bg-gray-800 text-white', label: 'B' },
      { id: 'R', color: 'bg-red-500 text-white', label: 'R' },
      { id: 'G', color: 'bg-green-500 text-white', label: 'G' },
      { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' }
    ];

    function App() {
      const [view, setView] = useState('home');
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeDeck, setActiveDeck] = useState(null); 
      
      const navigate = (newView, deck = null) => { setActiveDeck(deck); setView(newView); setMenuOpen(false); };

      return (
        <div className="min-h-screen flex flex-col text-gray-100 bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('mtg-bg.jpg')" }}>
          <div className="min-h-screen bg-gray-900/85 backdrop-blur-sm flex flex-col">
            <header className="bg-gray-900/95 border-b border-gray-700 p-4 flex justify-between items-center fixed top-0 w-full z-50 shadow-md no-print">
              <button onClick={() => setMenuOpen(true)} className="text-gray-300 hover:text-white"><Icons.Menu /></button>
              <h1 className="text-lg font-bold tracking-widest text-white">MTG <span className="text-red-500">FOR FUN</span></h1>
              <button onClick={() => navigate('home')} className="text-gray-300 hover:text-white"><Icons.Home /></button>
            </header>

            {menuOpen && (
              <div className="fixed inset-0 bg-black/80 z-50 no-print" onClick={() => setMenuOpen(false)}>
                <div className="w-64 bg-gray-900 h-full p-6 shadow-2xl border-r border-gray-700" onClick={e => e.stopPropagation()}>
                  <h2 className="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">Menu</h2>
                  <nav className="space-y-4">
                    <MenuBtn icon={<Icons.Home/>} text="Home" onClick={() => navigate('home')} />
                    <MenuBtn icon="🎴" text="Deckbuilding" onClick={() => navigate('deckbuilder')} />
                    <MenuBtn icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} />
                    <MenuBtn icon="✨" text="Proxy Creator" onClick={() => navigate('proxycreator')} />
                    <MenuBtn icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} />
                    <MenuBtn icon="🎲" text="Lancia Dado" onClick={() => navigate('dice')} />
                    <MenuBtn icon="⚖️" text="Arbitro AI" onClick={() => navigate('rules')} />
                  </nav>
                </div>
              </div>
            )}

            <main className="pt-20 px-2 pb-10 flex-1 animate-fade relative z-10">
              {view === 'home' && <HomeView navigate={navigate} />}
              {view === 'deckbuilder' && <DeckBuilder navigate={navigate} activeDeck={activeDeck} />}
              {view === 'mydecks' && <MyDecks navigate={navigate} />}
              {view === 'proxycreator' && <ProxyCreator />}
              {view === 'printview' && <PrintView deck={activeDeck} navigate={navigate} />}
              {view === 'game' && <GameUtility />}
              {view === 'dice' && <DiceRoller />}
              {view === 'rules' && <RulesAI />}
            </main>
          </div>
        </div>
      );
    }

    const MenuBtn = ({icon, text, onClick}) => (
      <button onClick={onClick} className="w-full flex items-center space-x-3 text-gray-300 hover:text-white p-2 rounded hover:bg-gray-800">
        <span className="flex items-center justify-center w-6 h-6">{icon}</span> <span className="font-semibold">{text}</span>
      </button>
    );

    // --- HOME ---
    const HomeView = ({navigate}) => (
      <div className="flex flex-col items-center justify-center pt-8">
        <div className="mb-12 text-center">
          <h2 className="text-5xl font-black text-white drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-widest">FOR FUN</h2>
          <h3 className="text-3xl font-black text-red-500 drop-shadow-md">EDITION</h3>
          <p className="text-gray-400 mt-2 font-semibold">Your Ultimate Commander Companion</p>
        </div>
        <div className="grid grid-cols-2 gap-4 w-full max-w-md">
          <ActionCard icon="🎴" text="Crea Mazzo" onClick={() => navigate('deckbuilder')} color="bg-blue-900/80 hover:bg-blue-800" />
          <ActionCard icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} color="bg-emerald-900/80 hover:bg-emerald-800" />
          <ActionCard icon="✨" text="Proxy Lair" onClick={() => navigate('proxycreator')} color="bg-purple-900/80 hover:bg-purple-800" />
          <ActionCard icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} color="bg-red-900/80 hover:bg-red-800" />
        </div>
      </div>
    );

    const ActionCard = ({icon, text, onClick, color}) => (
      <button onClick={onClick} className={`${color} p-6 rounded-xl flex flex-col items-center justify-center border border-gray-600 shadow-xl active:scale-95 transition-all backdrop-blur-md`}>
        <div className="text-4xl mb-2 drop-shadow-md">{icon}</div>
        <span className="font-bold text-sm tracking-wide">{text}</span>
      </button>
    );

    // --- DECKBUILDER ---
    const DeckBuilder = ({navigate, activeDeck}) => {
      const [deckName, setDeckName] = useState(activeDeck ? activeDeck.name : "");
      const [deck, setDeck] = useState(activeDeck ? activeDeck.cards : []);
      const [rulebreaker, setRulebreaker] = useState(activeDeck ? (activeDeck.rulebreaker || false) : false);
      
      const [query, setQuery] = useState("");
      const [mana, setMana] = useState([]);
      const [cardType, setCardType] = useState("");
      const [subType, setSubType] = useState("");
      const [cmcOp, setCmcOp] = useState("=");
      const [cmcVal, setCmcVal] = useState("");
      
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [nextPage, setNextPage] = useState(null);
      const [selectedCard, setSelectedCard] = useState(null);
      const [importText, setImportText] = useState("");
      const [showImport, setShowImport] = useState(false);

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = (url) => {
        setLoading(true);
        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data.data) {
               const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces[0].image_uris)).map(c => {
                 let img = null;
                 if (c.image_uris) img = c.image_uris.normal;
                 else if (c.card_faces && c.card_faces[0].image_uris) img = c.card_faces[0].image_uris.normal;
                 return {
                   id: c.id, name: c.name, image: img, type: c.type_line, cmc: c.cmc, colors: c.color_identity, isCommander: false
                 };
               });
               if (url.includes('page=')) setResults(prev => prev.concat(cards));
               else setResults(cards);
               setNextPage(data.has_more ? data.next_page : null);
            } else { 
               if(!url.includes('page=')) { setResults([]); alert("Nessuna carta trovata!"); }
            }
            setLoading(false);
          })
          .catch(e => { console.error(e); setLoading(false); });
      };

      const searchCard = () => {
        let searchQuery = query ? `${query} ` : "";
        if (mana.length > 0) searchQuery += `c:${mana.join('')} `;
        if (cardType) searchQuery += `t:${cardType} `;
        if (subType) searchQuery += `t:${subType} `;
        if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        
        if(!searchQuery.trim()) return alert("Inserisci almeno un parametro di ricerca!");
        eseguiRicerca(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery.trim())}`);
      };

      const loadMyProxies = () => {
        const proxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
        if (proxies.length === 0) return alert("Non hai ancora creato nessuna Proxy! Vai in Proxy Lair.");
        setResults(proxies);
        setNextPage(null);
      };

      const handleImport = () => {
        if(!importText.trim()) return;
        setLoading(true);
        const lines = importText.split('\n');
        let promises = [];
        
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim();
          if(!line) continue;
          const match = line.match(/^(\d+)?\s*(.*)$/);
          let qty = match[1] ? parseInt(match[1]) : 1;
          let name = match[2];
          
          let p = fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}`)
            .then(res => { if(res.ok) return res.json(); throw new Error('Not found'); })
            .then(c => {
               let arr = [];
               for(let j=0; j<qty; j++) {
                 let img = null;
                 if (c.image_uris) img = c.image_uris.normal;
                 else if (c.card_faces && c.card_faces[0].image_uris) img = c.card_faces[0].image_uris.normal;
                 arr.push({
                   id: c.id + '-' + j + Date.now() + Math.random(), name: c.name, image: img, 
                   type: c.type_line, cmc: c.cmc, colors: c.color_identity, isCommander: false
                 });
               }
               return arr;
            })
            .catch(e => { return []; });
          promises.push(p);
        }
        
        Promise.all(promises).then(resultsArray => {
           let newCards = [];
           resultsArray.forEach(arr => { newCards = newCards.concat(arr); });
           setDeck(prev => prev.concat(newCards));
           setShowImport(false); setImportText(""); setLoading(false);
        });
      };

      const addToDeck = (card) => {
        setDeck([...deck, {...card, deckId: Date.now()}]);
        setSelectedCard(null);
      };

      const saveDeck = () => {
        if(!deckName) return alert("Dai un nome al mazzo!");
        let savedDecks = JSON.parse(localStorage.getItem('mtg_decks') || '[]');
        const newDeckObj = { id: activeDeck ? activeDeck.id : Date.now(), name: deckName, cards: deck, rulebreaker: rulebreaker, date: new Date().toLocaleDateString() };
        if(activeDeck) savedDecks = savedDecks.map(d => d.id === activeDeck.id ? newDeckObj : d);
        else savedDecks.push(newDeckObj);
        localStorage.setItem('mtg_decks', JSON.stringify(savedDecks));
        alert("Mazzo Salvato!");
        navigate('mydecks');
      };

      const commanders = deck.filter(c => c.isCommander);
      const cmdColors = new Set();
      commanders.forEach(c => { if (c.colors) c.colors.forEach(col => cmdColors.add(col)); });
      
      let illegalColors = false;
      deck.forEach(c => {
        if(!c.isCommander && c.colors) {
          c.colors.forEach(col => { if(!cmdColors.has(col) && cmdColors.size > 0) illegalColors = true; });
        }
      });
      
      const isLegalSize = deck.length === 100;
      const totalCMC = deck.reduce((acc, c) => acc + (c.cmc || 0), 0);
      const avgCMC = deck.length > 0 ? (totalCMC / deck.length).toFixed(2) : 0;
      let deckRating = "Buono";
      if (avgCMC > 4.0) deckRating = "⚠️ Curva di mana alta! Rischia di essere lento.";
      if (avgCMC < 2.0) deckRating = "⚠️ Curva bassa! Assicurati di pescare molto.";

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          
          {selectedCard && (
            <div className="fixed inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center p-4 animate-fade" onClick={() => setSelectedCard(null)}>
              <div onClick={e => e.stopPropagation()} className="max-w-md w-full flex flex-col items-center">
                 <img src={selectedCard.proxyImage || selectedCard.image} alt={selectedCard.name} className="w-full max-h-[75vh] object-contain rounded-xl mb-6 shadow-2xl" />
                 <div className="flex gap-4 w-full">
                   <button onClick={() => setSelectedCard(null)} className="flex-1 bg-gray-600 text-white font-bold py-3 rounded-xl">Chiudi</button>
                   <button onClick={() => addToDeck(selectedCard)} className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">+ Aggiungi</button>
                 </div>
              </div>
            </div>
          )}

          <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm">
            <input type="text" placeholder="Nome del Mazzo" value={deckName} onChange={e => setDeckName(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-xl font-bold mb-4" />
            <div className="flex justify-between items-center text-sm mb-2">
              <span className={`px-2 py-1 rounded font-bold ${deck.length === 100 ? 'bg-green-600' : 'bg-red-600'}`}>{deck.length} / 100 Carte</span>
              <span className="bg-blue-600 px-2 py-1 rounded font-bold">Avg CMC: {avgCMC}</span>
            </div>
            {!rulebreaker && commanders.length > 0 && illegalColors && <span className="bg-red-600 px-2 py-1 rounded text-xs font-bold block mb-2">⚠️ Colori Illegali (non matchano col Cmdr)</span>}
            <p className="text-xs text-gray-300 mb-2 font-bold">{deckRating}</p>
            <label className="flex items-center gap-2 text-sm text-yellow-500 font-bold bg-yellow-900/30 p-2 rounded border border-yellow-700 cursor-pointer">
              <input type="checkbox" checked={rulebreaker} onChange={e => setRulebreaker(e.target.checked)} className="accent-yellow-500 w-4 h-4" />
              Attiva "Rulebreaker" (Ignora restrizioni)
            </label>
          </div>

          <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm">
             <h3 className="font-bold text-blue-400 mb-3 border-b border-gray-700 pb-1">Ricerca Avanzata</h3>
             <div className="flex gap-2 mb-3">
               <input type="text" placeholder="Nome o parola chiave..." value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard()} className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-white" />
             </div>
             
             <div className="flex gap-2 mb-3 overflow-x-auto pb-1 justify-center">
               {ManaColors.map(m => (
                 <button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>
               ))}
             </div>

             <div className="grid grid-cols-2 gap-2 mb-3">
               <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm">
                 <option value="">Tipo...</option>
                 <option value="creature">Creatura</option>
                 <option value="artifact">Artefatto</option>
                 <option value="enchantment">Incantesimo</option>
                 <option value="instant">Istantaneo</option>
                 <option value="sorcery">Stregoneria</option>
                 <option value="land">Terra</option>
               </select>
               <input type="text" placeholder="Sottotipo (es. Goblin)" value={subType} onChange={e => setSubType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" />
             </div>

             <div className="flex gap-2 mb-4">
               <span className="text-gray-300 text-sm py-2 font-bold">Costo:</span>
               <select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold">
                 <option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option>
               </select>
               <input type="number" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold text-center" />
             </div>

             <div className="flex gap-2">
               <button onClick={searchCard} className="flex-1 bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded text-white shadow-lg flex justify-center items-center gap-2">
                 {loading && !nextPage ? <span>Cerco...</span> : <span className="flex items-center gap-2"><Icons.Search /> Cerca</span>}
               </button>
               <button onClick={loadMyProxies} className="flex-1 bg-yellow-600 hover:bg-yellow-700 font-bold py-3 rounded text-white shadow-lg flex justify-center items-center gap-2">
                 📂 Le Mie Proxy
               </button>
             </div>
             
             <button onClick={() => setShowImport(!showImport)} className="text-sm text-blue-400 hover:text-blue-300 underline mt-4 block text-center w-full">📥 Importa da Testo (Es. Moxfield)</button>
             {showImport && (
               <div className="mt-2">
                 <textarea value={importText} onChange={e => setImportText(e.target.value)} placeholder="1 Sol Ring&#10;1 Command Tower" className="w-full h-24 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm mb-2"></textarea>
                 <button onClick={handleImport} className="w-full bg-green-600 hover:bg-green-700 p-2 rounded text-white font-bold">{loading ? 'Importo...' : 'Aggiungi Carte'}</button>
               </div>
             )}
          </div>

          {results.length > 0 && (
            <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 backdrop-blur-sm">
              <h3 className="text-gray-300 text-sm mb-3 font-bold">Trovate {results.length} carte (Clicca per ingrandire):</h3>
              <div className="grid grid-cols-3 gap-2">
                {results.map((card, i) => (
                  <div key={i} className="relative cursor-pointer hover:ring-2 ring-blue-500 rounded" onClick={() => setSelectedCard(card)}>
                    <img src={card.proxyImage || card.image} alt={card.name} className="w-full rounded shadow-sm" />
                  </div>
                ))}
              </div>
              {nextPage && (
                <button onClick={() => eseguiRicerca(nextPage)} className="mt-4 w-full bg-gray-700 hover:bg-gray-600 py-3 rounded font-bold text-blue-400 border border-blue-500">
                  {loading ? 'Caricamento...' : 'Carica Altre Carte ⬇️'}
                </button>
              )}
            </div>
          )}

          {deck.length > 0 && (
            <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm">
              <h3 className="font-bold text-white mb-3">La tua Lista:</h3>
              <div className="space-y-3">
                {deck.map((card, index) => (
                  <div key={card.deckId} className={`flex gap-3 bg-gray-900 p-2 rounded border ${card.isCommander ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : 'border-gray-700'}`}>
                    <img src={card.proxyImage || card.image} alt={card.name} className="w-16 rounded shadow object-cover cursor-pointer" onClick={() => setSelectedCard({image: card.proxyImage || card.image})} />
                    <div className="flex-1 text-sm">
                      <h4 className="font-bold text-gray-200">{card.name}</h4>
                      <p className="text-xs text-gray-400 truncate">{card.type}</p>
                      <div className="flex gap-3 mt-2 items-center">
                        <label className="flex items-center gap-1 text-yellow-500 text-xs font-bold cursor-pointer">
                          <input type="checkbox" checked={card.isCommander} onChange={() => {
                            const newDeck = [...deck];
                            newDeck[index].isCommander = !newDeck[index].isCommander;
                            setDeck(newDeck);
                          }} className="accent-yellow-500" /> Cmdr
                        </label>
                        <button onClick={() => setDeck(deck.filter(c => c.deckId !== card.deckId))} className="text-xs text-red-400 hover:text-red-300 font-bold ml-auto">Rimuovi ✖</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button onClick={saveDeck} className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(22,163,74,0.5)] sticky bottom-4">SALVA MAZZO</button>
        </div>
      );
    };

    // --- I MIEI MAZZI ---
    const MyDecks = ({navigate}) => {
      const [decks, setDecks] = useState([]);
      useEffect(() => { setDecks(JSON.parse(localStorage.getItem('mtg_decks') || '[]')); }, []);

      const deleteDeck = (id) => {
        if(confirm("Eliminare definitivamente?")) {
          const newD = decks.filter(d => d.id !== id);
          localStorage.setItem('mtg_decks', JSON.stringify(newD));
          setDecks(newD);
        }
      };

      const exportText = (deck) => {
        const text = deck.cards.map(c => `1 ${c.name}`).join('\n');
        navigator.clipboard.writeText(text); alert("Lista copiata negli appunti!");
      };

      if (decks.length === 0) return <div className="text-center text-gray-400 mt-10 font-bold bg-gray-900/80 p-6 rounded-xl border border-gray-700">Nessun mazzo salvato. Vai nel Deckbuilder!</div>;

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
          {decks.map(d => {
            const cmds = d.cards.filter(c => c.isCommander);
            let mainImg = '';
            if (cmds.length > 0 && cmds[0]) mainImg = cmds[0].proxyImage || cmds[0].image;
            else if (d.cards[0]) mainImg = d.cards[0].proxyImage || d.cards[0].image;

            return (
              <div key={d.id} className="bg-gray-800/90 backdrop-blur-sm rounded-xl border border-gray-600 overflow-hidden shadow-xl flex flex-col">
                 <div className="h-32 bg-gray-900 relative">
                   <img src={mainImg} className="w-full h-full object-cover object-top opacity-60" />
                   <div className="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                   <h3 className="absolute bottom-2 left-4 text-2xl font-black text-white drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">{d.name}</h3>
                 </div>
                 <div className="p-3 bg-gray-900 grid grid-cols-2 gap-2 text-sm font-bold">
                   <button onClick={() => navigate('deckbuilder', d)} className="bg-blue-600 hover:bg-blue-500 text-white rounded py-2 shadow">Modifica</button>
                   <button onClick={() => navigate('printview', d)} className="bg-purple-600 hover:bg-purple-500 text-white rounded py-2 shadow">Stampa PDF</button>
                   <button onClick={() => exportText(d)} className="bg-gray-700 hover:bg-gray-600 text-white rounded py-2 shadow">Esporta Testo</button>
                   <button onClick={() => deleteDeck(d.id)} className="bg-red-800 hover:bg-red-700 text-white rounded py-2 shadow">Elimina</button>
                 </div>
              </div>
            );
          })}
        </div>
      );
    };

    // --- STAMPA PROXY (PDF) ---
    const PrintView = ({deck, navigate}) => {
      if(!deck) return null;
      return (
        <div className="print-container w-full h-full bg-white text-black p-4 absolute top-0 left-0 z-50">
          <div className="no-print mb-4 p-4 bg-gray-100 rounded border border-gray-300 flex justify-between items-center shadow-md">
            <p className="font-bold text-gray-800">Usa "Stampa -> Salva come PDF".<br/>(Carte formattate esattamente a 63x88mm).</p>
            <div className="space-x-2">
              <button onClick={() => navigate('mydecks')} className="px-4 py-2 bg-gray-500 text-white rounded font-bold">Indietro</button>
              <button onClick={() => window.print()} className="px-4 py-2 bg-blue-600 text-white font-bold rounded">Stampa PDF</button>
            </div>
          </div>
          <div className="print-grid">
            {deck.cards.map((c, i) => <img key={i} src={c.proxyImage || c.image} className="print-card shadow-sm border border-gray-300" />)}
          </div>
        </div>
      );
    };

    // --- PROXY CREATOR AVANZATO ---
    const ProxyCreator = () => {
      const [baseQuery, setBaseQuery] = useState("");
      const [baseCard, setBaseCard] = useState(null);
      const [customName, setCustomName] = useState("");
      const [customImg, setCustomImg] = useState("");
      
      // Controlli per muovere l'immagine
      const [zoom, setZoom] = useState(1);
      const [posX, setPosX] = useState(50);
      const [posY, setPosY] = useState(50);
      
      const searchBase = () => {
        fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(baseQuery)}`)
          .then(res => res.json())
          .then(c => {
             if(c.id) {
               let imgUrl = null;
               if (c.image_uris) imgUrl = c.image_uris.normal;
               else if (c.card_faces && c.card_faces[0].image_uris) imgUrl = c.card_faces[0].image_uris.normal;
               
               setBaseCard({ name: c.name, type: c.type_line, img: imgUrl, cmc: c.cmc });
               setCustomName(""); setCustomImg("");
               setZoom(1); setPosX(50); setPosY(50);
             } else {
               alert("Carta non trovata");
             }
          }).catch(e => { console.error(e); });
      };

      const handleImage = (e) => {
        const file = e.target.files[0];
        if(file) {
          const r = new FileReader();
          r.onload = (ev) => setCustomImg(ev.target.result);
          r.readAsDataURL(file);
        }
      };

      const saveProxy = () => {
        if(!baseCard || !customImg) return alert("Cerca una carta base e carica un'immagine!");
        const newProxy = {
          id: 'proxy-' + Date.now(),
          name: customName || baseCard.name,
          image: customImg, 
          proxyImage: customImg, 
          type: baseCard.type,
          cmc: baseCard.cmc || 0,
          colors: [],
          isCommander: false,
          isCustom: true
        };
        let savedProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
        savedProxies.push(newProxy);
        localStorage.setItem('mtg_proxies', JSON.stringify(savedProxies));
        alert("Carta Salvata! Ora vai in Deckbuilder e clicca su 'Le Mie Proxy' per aggiungerla ai tuoi mazzi.");
      };

      return (
        <div className="max-w-md mx-auto space-y-4">
          <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm">
            <h2 className="text-xl font-bold text-purple-400 mb-2">Proxy Lair Creator</h2>
            <p className="text-xs text-gray-300 mb-4">Carica la tua illustrazione AI. Inserisci il nome e posiziona la foto. Salva la proxy nel database per usarla nei mazzi!</p>
            
            <div className="flex gap-2 mb-4">
              <input type="text" placeholder="Carta Base (es. Sol Ring)" value={baseQuery} onChange={e => setBaseQuery(e.target.value)} className="flex-1 bg-gray-900 border border-gray-600 p-2 rounded text-white" />
              <button onClick={searchBase} className="bg-purple-600 hover:bg-purple-500 px-4 rounded text-white font-bold">Cerca</button>
            </div>
            
            {baseCard && (
              <div className="space-y-4 animate-fade">
                <input type="text" placeholder="Nuovo Titolo (Nickname)" value={customName} onChange={e => setCustomName(e.target.value)} className="w-full bg-gray-900 border border-gray-600 p-2 rounded text-white font-bold" />
                <label className="block w-full bg-gray-700 hover:bg-gray-600 text-center py-3 rounded cursor-pointer font-bold text-sm text-white shadow-md">
                  📸 Carica la tua Illustrazione
                  <input type="file" accept="image/*" className="hidden" onChange={handleImage} />
                </label>
                
                {customImg && (
                  <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-2">
                     <p className="text-xs font-bold text-gray-400 text-center">Regola l'Immagine</p>
                     <div className="flex items-center gap-2"><span className="text-xs w-10">Zoom</span><input type="range" min="1" max="3" step="0.1" value={zoom} onChange={e=>setZoom(e.target.value)} className="w-full accent-purple-500" /></div>
                     <div className="flex items-center gap-2"><span className="text-xs w-10">Orizz.</span><input type="range" min="0" max="100" value={posX} onChange={e=>setPosX(e.target.value)} className="w-full accent-purple-500" /></div>
                     <div className="flex items-center gap-2"><span className="text-xs w-10">Vert.</span><input type="range" min="0" max="100" value={posY} onChange={e=>setPosY(e.target.value)} className="w-full accent-purple-500" /></div>
                  </div>
                )}

                <div className="relative w-full rounded-xl overflow-hidden shadow-2xl bg-black border border-gray-600 mt-4" style={{ aspectRatio: '63/88' }}>
                  <img src={baseCard.img} className="absolute inset-0 w-full h-full" />
                  
                  {customImg && (
                    <div className="absolute bg-black z-10 overflow-hidden shadow-inner" style={{ top: '11.5%', left: '8%', width: '84%', height: '44%' }}>
                      <img src={customImg} className="w-full h-full" style={{ objectFit: 'cover', objectPosition: `${posX}% ${posY}%`, transform: `scale(${zoom})` }} />
                    </div>
                  )}

                  {customName && (
                    <div className="absolute z-20 flex items-center px-3" style={{ top: '4.8%', left: '7.5%', width: '65%', height: '4.5%' }}>
                      <span className="text-white tracking-wider truncate" style={{ fontFamily: "Georgia, serif", fontSize: '15px', fontWeight: '900', textShadow: '2px 2px 4px black, 0 0 4px black, 0 0 10px black' }}>{customName}</span>
                    </div>
                  )}
                </div>

                <button onClick={saveProxy} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg shadow-lg mt-4">
                  💾 Salva nei Tuoi Mazzi (Database)
                </button>
              </div>
            )}
          </div>
          
          <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 text-center shadow-md backdrop-blur-sm">
             <h3 className="text-blue-400 font-bold mb-2">Vuoi layout professionali?</h3>
             <p className="text-xs text-gray-300 mb-3">L'editor qui sopra è perfetto per Proxy rapide. Se cerchi frame complessi (es. Full Art, Planeswalker) usa i tool professionali gratuiti online:</p>
             <div className="space-y-2">
               <a href="https://mtgcardbuilder.com/" target="_blank" className="block w-full bg-gray-700 hover:bg-gray-600 py-2 rounded text-white font-bold text-sm">Apri MTGCardBuilder 🌐</a>
               <a href="https://cardconjurer.onrender.com/" target="_blank" className="block w-full bg-gray-700 hover:bg-gray-600 py-2 rounded text-white font-bold text-sm">Apri CardConjurer 🌐</a>
             </div>
             <p className="text-xs text-gray-400 mt-3">Scarica l'immagine finale e usa il tasto "Le Mie Proxy" nel Deckbuilder per caricarla nel tuo mazzo!</p>
          </div>
        </div>
      );
    };

    // --- GAME UTILITY (LIFE TRACKER - FIXATO 1 SECONDO) ---
    const GameUtility = () => {
      const [setup, setSetup] = useState(true);
      const [numPlayers, setNumPlayers] = useState(4);
      const [startLife, setStartLife] = useState(40);
      const [players, setPlayers] = useState([]);

      const startGame = () => {
        let newPlayers = [];
        for(let i=1; i<=numPlayers; i++) {
          let cmdDmg = {};
          for(let j=1; j<=numPlayers; j++) { if(i!==j) cmdDmg[`P${j}`] = 0; }
          newPlayers.push({ id: `P${i}`, name: `Player ${i}`, life: startLife, poison: 0, cmdCasts: 0, emblems: 0, immune: false, cmdDmg: cmdDmg });
        }
        setPlayers(newPlayers);
        setSetup(false);
      };

      const updateStat = (playerId, stat, amount, opponentId = null) => {
        setPlayers(prev => prev.map(p => {
          if (p.id !== playerId) return p;
          if (opponentId) {
             let newDmg = { ...p.cmdDmg };
             newDmg[opponentId] = Math.max(0, newDmg[opponentId] + amount);
             return { ...p, cmdDmg: newDmg };
          }
          return { ...p, [stat]: Math.max(0, p[stat] + amount) };
        }));
      };

      const toggleImmunity = (playerId) => { setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, immune: !p.immune } : p)); };

      if (setup) return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm">
          <h2 className="text-3xl font-black mb-6 text-center text-red-500 drop-shadow-md">Setup Partita</h2>
          <div className="mb-4">
            <label className="block text-gray-300 font-bold mb-2">Numero Giocatori (1-6)</label>
            <input type="number" min="1" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center text-xl font-bold" />
          </div>
          <div className="mb-6">
            <label className="block text-gray-300 font-bold mb-2">Punti Vita Iniziali</label>
            <select value={startLife} onChange={e => setStartLife(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center text-xl font-bold">
              <option value={40}>40 (Commander)</option>
              <option value={20}>20 (Standard)</option>
            </select>
          </div>
          <button onClick={startGame} className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl text-xl shadow-[0_0_15px_rgba(220,38,38,0.5)]">INIZIA</button>
        </div>
      );

      const gridClass = players.length === 1 ? 'grid-cols-1' : (players.length <= 4 ? 'grid-cols-2' : 'grid-cols-2 lg:grid-cols-3');

      return (
        <div className={`grid ${gridClass} gap-3 h-[80vh]`}>
          {players.map(p => <PlayerCard key={p.id} player={p} updateStat={updateStat} toggleImmunity={toggleImmunity} opponents={players.filter(op => op.id !== p.id)} />)}
        </div>
      );
    };

    const PlayerCard = ({ player, updateStat, toggleImmunity, opponents }) => {
      const [viewStats, setViewStats] = useState(false); 
      
      let isDead = false;
      if (!player.immune) {
         if (player.life <= 0) isDead = true;
         if (player.poison >= 10) isDead = true;
         Object.keys(player.cmdDmg).forEach(key => { if (player.cmdDmg[key] >= 21) isDead = true; });
      }

      // SISTEMA ANTI-DOPPIO TOCCO E HOLD A 1 SECONDO
      const handleHold = (stat, amount, oppId = null) => {
        let timer = null;
        let fired = false;
        
        const start = (e) => {
          if(fired) return; // Evita eventi doppi da cellulare
          fired = true;
          setTimeout(()=> fired = false, 300); // Blocca click aggiuntivi per 300ms
          
          updateStat(player.id, stat, amount, oppId); // Scatto Iniziale
          
          timer = setTimeout(() => { 
             updateStat(player.id, stat, amount * 9, oppId); 
             if(navigator.vibrate) navigator.vibrate(50);
          }, 1000); // 1 Secondo esatto di attesa
        };
        const clear = () => clearTimeout(timer);
        
        return {
          onPointerDown: start,
          onPointerUp: clear,
          onPointerLeave: clear,
          onPointerCancel: clear,
          onContextMenu: (e) => { e.preventDefault(); clear(); }
        };
      };

      if (viewStats) {
        return (
          <div className="w-full h-full min-h-[250px] flex flex-col rounded-xl border-4 border-blue-600 bg-gray-900/90 backdrop-blur-md overflow-hidden shadow-2xl p-2 animate-fade">
            <div className="flex justify-between items-center border-b border-gray-700 pb-2 mb-2">
              <span className="font-bold text-sm text-blue-400">Stats: {player.name}</span>
              <button onClick={() => setViewStats(false)} className="p-2 bg-blue-600 rounded-full text-white shadow-lg"><Icons.Back/></button>
            </div>
            
            <div className="overflow-y-auto space-y-3 pb-2 text-sm flex-1 pr-1">
              <div className="bg-gray-800 p-2 rounded-lg border border-gray-700">
                <p className="text-xs text-red-400 font-bold mb-2 uppercase text-center">⚔️ Danni Comandante Da:</p>
                {opponents.map(opp => (
                   <StatRow key={opp.id} label={opp.name} value={player.cmdDmg[opp.id]} handlers={{sub: handleHold('cmdDmg', -1, opp.id), add: handleHold('cmdDmg', 1, opp.id)}} />
                ))}
              </div>

              <div className="space-y-2 bg-gray-800 p-2 rounded-lg border border-gray-700">
                <StatRow label="💧 Veleno" value={player.poison} handlers={{sub: handleHold('poison', -1), add: handleHold('poison', 1)}} />
                <StatRow label="⚔️ Lanci Cmd" value={player.cmdCasts} handlers={{sub: handleHold('cmdCasts', -1), add: handleHold('cmdCasts', 1)}} />
                <StatRow label="🛡️ Emblemi" value={player.emblems} handlers={{sub: handleHold('emblems', -1), add: handleHold('emblems', 1)}} />
              </div>
            </div>
            
            <button onClick={() => toggleImmunity(player.id)} className={`w-full py-3 mt-2 text-sm font-bold rounded-lg shadow-md transition-colors ${player.immune ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 border border-gray-600 hover:bg-gray-700'}`}>
              {player.immune ? '🛡️ Immunità Attiva' : 'Attiva Immunità'}
            </button>
          </div>
        );
      }

      return (
        <div className={`w-full h-full min-h-[250px] flex flex-col rounded-xl border-4 relative animate-fade ${isDead ? 'border-red-600 bg-red-950/90' : 'border-gray-600 bg-gray-900/90'} backdrop-blur-md overflow-hidden shadow-2xl`}>
          {isDead && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-30 pointer-events-none">💀</div>}
          {player.immune && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-20 pointer-events-none text-blue-500 drop-shadow-lg">🛡️</div>}
          
          <div className="flex justify-between items-center bg-black/50 p-3 z-10 border-b border-gray-700 shadow-sm">
            <span className="font-bold text-gray-200 text-lg drop-shadow-md">{player.name}</span>
            <button onClick={() => setViewStats(true)} className="px-3 py-1 bg-gray-700 border border-gray-500 hover:bg-gray-600 rounded text-xs text-white shadow-lg font-bold transition-colors">Stats ⚙️</button>
          </div>
          
          <div className="flex-1 flex items-center justify-between px-2 z-10">
            <button {...handleHold('life', -1)} className="w-16 h-full flex items-center justify-center text-5xl font-bold text-red-500 active:bg-red-500/30 rounded-l transition-colors drop-shadow-md">-</button>
            <div className="text-7xl font-black text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">{player.life}</div>
            <button {...handleHold('life', 1)} className="w-16 h-full flex items-center justify-center text-5xl font-bold text-green-500 active:bg-green-500/30 rounded-r transition-colors drop-shadow-md">+</button>
          </div>
        </div>
      );
    };

    const StatRow = ({ label, value, handlers }) => (
      <div className="flex justify-between items-center bg-gray-900 rounded px-2 py-1 mt-1 border border-gray-700 shadow-inner">
        <span className="text-gray-300 font-bold truncate max-w-[50%]">{label}</span>
        <div className="flex items-center space-x-3">
          <button {...handlers.sub} className="w-8 h-8 bg-red-900/80 hover:bg-red-800 rounded font-bold text-red-300 transition-colors">-</button>
          <span className="w-6 text-center font-bold text-white text-lg">{value}</span>
          <button {...handlers.add} className="w-8 h-8 bg-green-900/80 hover:bg-green-800 rounded font-bold text-green-300 transition-colors">+</button>
        </div>
      </div>
    );

    // --- DICE ROLLER ---
    const DiceRoller = () => {
      const [numPlayers, setNumPlayers] = useState(4);
      const [results, setResults] = useState([]);
      const [winnerMessage, setWinnerMessage] = useState("");

      const rollDice = () => {
        let rolls = []; let max = 0;
        for(let i=1; i<=numPlayers; i++) {
          const roll = Math.floor(Math.random() * 20) + 1;
          rolls.push({ player: `Player ${i}`, roll: roll });
          if(roll > max) max = roll;
        }
        setResults(rolls);
        const winners = rolls.filter(r => r.roll === max);
        if(winners.length === 1) setWinnerMessage(`🎉 Inizia: ${winners[0].player}!`);
        else setWinnerMessage(`Pareggio tra: ${winners.map(w=>w.player).join(', ')}. Ritirate!`);
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl border border-gray-600 mt-10 backdrop-blur-sm shadow-xl">
          <h2 className="text-3xl font-black mb-6 text-center text-purple-500 drop-shadow-md">Tira il Dado (D20)</h2>
          <label className="block text-gray-300 font-bold mb-2">Numero Giocatori</label>
          <input type="number" min="2" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center mb-6 font-bold text-xl" />
          <button onClick={rollDice} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-xl text-xl mb-6 shadow-[0_0_15px_rgba(147,51,234,0.5)]">TIRA IL DADO</button>
          {results.length > 0 && (
            <div className="space-y-2 animate-fade">
              {results.map((r, i) => (
                <div key={i} className="flex justify-between p-3 bg-gray-900 rounded border border-gray-700 shadow-inner">
                  <span className="font-bold text-gray-300 text-lg">{r.player}</span>
                  <span className={`font-black text-xl ${r.roll === 20 ? 'text-green-400' : (r.roll === 1 ? 'text-red-400' : 'text-white')}`}>{r.roll}</span>
                </div>
              ))}
              <div className="mt-4 p-4 bg-green-900/40 border border-green-500 rounded-lg text-center font-bold text-green-400 text-lg shadow-md">{winnerMessage}</div>
            </div>
          )}
        </div>
      );
    };

    // --- ARBITRO AI ---
    const RulesAI = () => {
      const [question, setQuestion] = useState("");
      const askJudge = () => {
        if(!question) return;
        const prompt = `Sei un Arbitro Livello 3 di Magic: The Gathering. Rispondi in italiano a questo dubbio: "${question}"`;
        window.open(`https://gemini.google.com/app?q=${encodeURIComponent(prompt)}`, '_blank');
      };
      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl border border-gray-600 mt-10 text-center backdrop-blur-sm shadow-xl">
          <h2 className="text-3xl font-black mb-4 text-green-500 drop-shadow-md">Arbitro AI</h2>
          <p className="text-sm text-gray-300 mb-6 font-semibold">Chiedi direttamente all'intelligenza di Gemini la risoluzione di una pila o di un ruling complicato.</p>
          <textarea className="w-full h-32 bg-gray-900 border border-gray-600 rounded p-3 text-white mb-6 font-semibold" placeholder="Es: Se attacco con..." value={question} onChange={(e) => setQuestion(e.target.value)}></textarea>
          <button onClick={askJudge} className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl flex justify-center w-full shadow-[0_0_15px_rgba(22,163,74,0.5)]">Chiedi al Judge</button>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
